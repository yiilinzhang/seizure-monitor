services:
  - type: web
    name: seizure-monitor-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: ./database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://velvety-starlight-e9ddcd.netlify.app