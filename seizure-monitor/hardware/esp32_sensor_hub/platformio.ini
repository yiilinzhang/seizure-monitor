; PlatformIO Project Configuration File for Seizure Monitor Sensor Hub
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Build options
build_flags =
    -D WIFI_SSID=\"YOUR_WIFI_SSID\"
    -D WIFI_PASSWORD=\"YOUR_WIFI_PASSWORD\"
    -D API_URL=\"http://YOUR_SERVER_IP:8000\"
    -D API_TOKEN=\"YOUR_AUTH_TOKEN\"

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit BusIO@^1.16.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    https://github.com/espressif/arduino-esp32.git
