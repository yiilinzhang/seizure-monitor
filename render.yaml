services:
  - type: web
    name: seizure-monitor-backend
    env: node
    rootDir: ./backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://seizure-monitor.netlify.app
    healthCheckPath: /api/health